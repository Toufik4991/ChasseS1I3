<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mots Cachés - Tap Mode</title>
<style>
  :root {
    --bg: #0a0a0c;
    --cell-bg: #1a1a20;
    --win: #00ff88;
    --select: #ff007a;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg);
    font-family: sans-serif;
    color: white;
    margin: 0;
    touch-action: manipulation; 
    user-select: none;
  }

  table {
    border-collapse: separate;
    border-spacing: 2px;
    background: #111;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 0 35px rgba(0,0,0,0.8);
    width: 95vw;
    max-width: 450px;
  }

  td {
    width: 6vw;
    height: 6vw;
    max-width: 30px;
    max-height: 30px;
    text-align: center;
    background: var(--cell-bg);
    color: #888;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.2s ease;
    border-radius: 3px;
    cursor: pointer;
  }

  /* La lettre reste allumée quand on clique dessus */
  td.selecting {
    background: var(--select) !important;
    color: white !important;
    transform: scale(1.1);
    box-shadow: 0 0 10px var(--select);
  }

  td.found {
    background: var(--win) !important;
    color: black !important;
    transform: scale(1) !important;
    box-shadow: none !important;
  }

  #message {
    height: 40px;
    margin-top: 15px;
    font-size: 24px;
    font-weight: bold;
    color: var(--win);
    text-align: center;
  }

  .controls {
    margin-bottom: 10px;
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="controls">TOUCHEZ LES LETTRES POUR FORMER LES MOTS</div>
<table id="grid"></table>
<div id="message"></div>

<script>
const words = [
  { text: "REMBARDE", row: 2, col: 2, dir: "D" },
  { text: "METALLIQUE", row: 12, col: 12, dir: "VR" } 
];

const size = 15;
let grid = Array.from({length: size}, () => Array(size).fill(''));
let selectedCells = [];
let foundWordsCount = 0;

// Placement des mots
words.forEach(w => {
  for (let i = 0; i < w.text.length; i++) {
    let r, c;
    if (w.dir === "D") { r = w.row + i; c = w.col + i; }
    else if (w.dir === "VR") { r = w.row - i; c = w.col; }
    if (r >= 0 && r < size && c >= 0 && c < size) grid[r][c] = w.text[i];
  }
});

// Remplissage aléatoire
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for (let r = 0; r < size; r++) {
  for (let c = 0; c < size; c++) {
    if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
  }
}

const table = document.getElementById("grid");
for (let r = 0; r < size; r++) {
  const tr = document.createElement("tr");
  for (let c = 0; c < size; c++) {
    const td = document.createElement("td");
    td.textContent = grid[r][c];
    
    // Gestion du clic unique (Tap)
    td.addEventListener("click", () => handleTap(td));
    
    tr.appendChild(td);
  }
  table.appendChild(tr);
}

function handleTap(td) {
  if (td.classList.contains("found")) return;

  // Si déjà sélectionné, on enlève (Toggle)
  if (td.classList.contains("selecting")) {
    td.classList.remove("selecting");
    selectedCells = selectedCells.filter(cell => cell !== td);
  } else {
    // Sinon on ajoute
    td.classList.add("selecting");
    selectedCells.push(td);
  }

  checkSequence();
}

function checkSequence() {
  if (selectedCells.length === 0) return;

  const currentString = selectedCells.map(td => td.textContent).join("");
  const reversedString = currentString.split("").reverse().join("");

  let match = words.find(w => currentString === w.text || reversedString === w.text);

  if (match) {
    // Mot trouvé !
    selectedCells.forEach(td => {
      td.classList.remove("selecting");
      td.classList.add("found");
    });
    selectedCells = []; // Reset la sélection pour le prochain mot
    foundWordsCount++;
    showFeedback(match.text);
  }
}

function showFeedback(wordFound) {
  const msg = document.getElementById("message");
  if (wordFound === "REMBARDE") msg.textContent = "🐾 MIAOU ! 🐾";
  else msg.textContent = "BIEN JOUÉ !";

  if (foundWordsCount === words.length) {
    msg.textContent = "TERMINÉ 🎉";
  } else {
    setTimeout(() => { if(msg.textContent !== "TERMINÉ 🎉") msg.textContent = ""; }, 2000);
  }
}
</script>

</body>
</html>

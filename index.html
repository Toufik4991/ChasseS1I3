<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mots Cachés Mystère - 15x15</title>
<style>
  :root {
    --bg: #0a0a0c;
    --cell-bg: #1a1a20;
    --accent: #00d2ff;
    --win: #00ff88;
    --select: #ff007a;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Orbitron', sans-serif, Arial;
    color: white;
    margin: 0;
    /* Bloque le scroll et le rafraîchissement par glissement sur mobile */
    touch-action: none; 
    overflow: hidden;
    user-select: none;
  }

  table {
    border-collapse: separate;
    border-spacing: 2px;
    background: #111;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 0 35px rgba(0,0,0,0.8);
    border: 1px solid #333;
    width: 95vw;
    max-width: 450px; /* Taille optimale sur smartphone */
  }

  td {
    width: 6vw; /* Taille adaptative */
    height: 6vw;
    max-width: 30px;
    max-height: 30px;
    text-align: center;
    background: var(--cell-bg);
    color: #888;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.1s ease;
    border-radius: 3px;
  }

  /* État pendant que le doigt glisse sur la case */
  td.selecting {
    background: var(--select) !important;
    color: white !important;
    transform: scale(1.1);
    box-shadow: 0 0 10px var(--select);
    z-index: 10;
  }

  /* État quand le mot est validé */
  td.found {
    background: var(--win) !important;
    color: black !important;
    animation: flash 0.5s ease-out;
  }

  @keyframes flash {
    0% { filter: brightness(2); transform: scale(1.15); }
    100% { filter: brightness(1); transform: scale(1); }
  }

  #message {
    height: 40px;
    margin-top: 15px;
    font-size: 24px;
    font-weight: bold;
    color: var(--win);
    text-shadow: 0 0 15px var(--win);
  }
</style>
</head>
<body>

<table id="grid"></table>
<div id="message"></div>

<script>
// Tes mots configurés pour une grille 15x15
const words = [
  { text: "REMBARDE", row: 2, col: 2, dir: "D" },
  { text: "METALLIQUE", row: 3, col: 12, dir: "V" }
];

const size = 15;
let grid = Array.from({length: size}, () => Array(size).fill(''));
let isSelecting = false;
let selectedCells = [];
let foundWordsCount = 0;

// 1. Placement des mots
words.forEach(w => {
  for (let i = 0; i < w.text.length; i++) {
    let r = w.row + (w.dir === "V" || w.dir === "D" ? i : 0);
    let c = w.col + (w.dir === "H" || w.dir === "D" ? i : 0);
    if (r < size && c < size) grid[r][c] = w.text[i];
  }
});

// 2. Remplissage aléatoire
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for (let r = 0; r < size; r++) {
  for (let c = 0; c < size; c++) {
    if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
  }
}

// 3. Création de la grille tactile
const table = document.getElementById("grid");
const tdGrid = [];

for (let r = 0; r < size; r++) {
  const tr = document.createElement("tr");
  tdGrid[r] = [];
  for (let c = 0; c < size; c++) {
    const td = document.createElement("td");
    td.textContent = grid[r][c];
    
    // Support Tactile Mobile
    td.addEventListener("touchstart", (e) => {
      e.preventDefault();
      startSelection(td);
    });
    
    tr.appendChild(td);
    tdGrid[r][c] = td;
  }
  table.appendChild(tr);
}

// Détection du glissement par coordonnées (nécessaire pour mobile)
window.addEventListener("touchmove", (e) => {
  if (!isSelecting) return;
  const touch = e.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (el && el.tagName === "TD") {
    continueSelection(el);
  }
});

window.addEventListener("touchend", endSelection);

// --- FONCTIONS DE JEU ---

function startSelection(td) {
  if (td.classList.contains("found")) return;
  isSelecting = true;
  selectedCells = [td];
  td.classList.add("selecting");
}

function continueSelection(td) {
  if (!isSelecting || td.classList.contains("found")) return;
  if (!selectedCells.includes(td)) {
    selectedCells.push(td);
    td.classList.add("selecting");
  }
}

function endSelection() {
  if (!isSelecting) return;
  isSelecting = false;
  
  const currentString = selectedCells.map(td => td.textContent).join("");
  const reversedString = currentString.split("").reverse().join("");
  
  let match = words.find(w => currentString === w.text || reversedString === w.text);
  
  if (match) {
    selectedCells.forEach(td => {
      td.classList.remove("selecting");
      td.classList.add("found");
    });
    foundWordsCount++;
    showFeedback(match.text);
  } else {
    selectedCells.forEach(td => td.classList.remove("selecting"));
  }
  selectedCells = [];
}

function showFeedback(wordFound) {
  const msg = document.getElementById("message");
  if (wordFound === "REMBARDE") {
    msg.textContent = "🐾 MIAOU ! 🐾";
  } else {
    msg.textContent = "BIEN JOUÉ !";
  }

  if (foundWordsCount === words.length) {
    msg.textContent = "TERMINÉ 🎉";
  } else {
    setTimeout(() => { if(msg.textContent !== "TERMINÉ 🎉") msg.textContent = ""; }, 2000);
  }
}
</script>

</body>
</html>

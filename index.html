<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mots Cachés Mystère - Mobile</title>
<style>
  :root {
    --bg: #0a0a0c;
    --cell-bg: #1a1a20;
    --win: #00ff88;
    --select: #ff007a; 
    --hint: #ffcc00;   
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg);
    font-family: sans-serif;
    color: white;
    margin: 0;
    touch-action: none; 
    overflow: hidden;
    user-select: none;
  }

  table {
    border-collapse: separate;
    border-spacing: 2px;
    background: #111;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 0 35px rgba(0,0,0,0.8);
    border: 1px solid #333;
    width: 95vw;
    max-width: 450px;
  }

  td {
    width: 6vw;
    height: 6vw;
    max-width: 30px;
    max-height: 30px;
    text-align: center;
    background: var(--cell-bg);
    color: #888;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s, transform 0.1s;
    border-radius: 3px;
  }

  td.hinted { background: var(--hint) !important; color: black !important; }
  td.selecting { background: var(--select) !important; color: white !important; transform: scale(1.1); z-index: 10; }
  td.found { background: var(--win) !important; color: black !important; animation: flash 0.5s ease-out; }

  @keyframes flash {
    0% { filter: brightness(2); transform: scale(1.15); }
    100% { filter: brightness(1); transform: scale(1); }
  }

  #message {
    height: auto;
    margin-top: 15px;
    font-size: 28px;
    font-weight: bold;
    color: var(--win);
    text-shadow: 0 0 15px var(--win);
    text-align: center;
    padding: 20px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<table id="grid"></table>
<div id="message"></div>

<script>
const words = [
  { text: "REMBARDE", row: 2, col: 2, dir: "D" },
  { text: "METALLIQUE", row: 12, col: 12, dir: "VR" } 
];

const size = 15;
let grid = Array.from({length: size}, () => Array(size).fill(''));
let isDragging = false;
let selectedCells = [];
let foundWordsCount = 0;

words.forEach(w => {
  for (let i = 0; i < w.text.length; i++) {
    let r, c;
    if (w.dir === "D") { r = w.row + i; c = w.col + i; }
    else if (w.dir === "VR") { r = w.row - i; c = w.col; }
    if (r >= 0 && r < size && c >= 0 && c < size) grid[r][c] = w.text[i];
  }
});

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for (let r = 0; r < size; r++) {
  for (let c = 0; c < size; c++) {
    if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
  }
}

const table = document.getElementById("grid");
for (let r = 0; r < size; r++) {
  const tr = document.createElement("tr");
  for (let c = 0; c < size; c++) {
    const td = document.createElement("td");
    td.textContent = grid[r][c];
    td.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if(!td.classList.contains("found")) td.classList.toggle("hinted");
      startDragging(td);
    });
    tr.appendChild(td);
  }
  table.appendChild(tr);
}

window.addEventListener("touchmove", (e) => {
  if (!isDragging) return;
  const touch = e.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (el && el.tagName === "TD") continueDragging(el);
});

window.addEventListener("touchend", endSelection);

function startDragging(td) {
  if (td.classList.contains("found")) return;
  isDragging = true;
  selectedCells = [td];
  td.classList.add("selecting");
}

function continueDragging(td) {
  if (!isDragging || td.classList.contains("found")) return;
  if (!selectedCells.includes(td)) {
    selectedCells.push(td);
    td.classList.add("selecting");
  }
}

function checkValidation(cells) {
  const currentString = cells.map(td => td.textContent).join("");
  const reversedString = currentString.split("").reverse().join("");
  return words.find(w => currentString === w.text || reversedString === w.text);
}

function endSelection() {
  if (!isDragging) return;
  isDragging = false;
  
  let match = checkValidation(selectedCells);
  if (!match) {
    const hintedCells = Array.from(document.querySelectorAll('.hinted'));
    match = checkValidation(hintedCells);
    if (match) selectedCells = hintedCells;
  }
  
  if (match) {
    selectedCells.forEach(td => {
      td.classList.remove("selecting", "hinted");
      td.classList.add("found");
    });
    foundWordsCount++;
    showFeedback(match.text);
  } else {
    selectedCells.forEach(td => td.classList.remove("selecting"));
  }
  selectedCells = [];
}

function showFeedback(wordFound) {
  const msg = document.getElementById("message");
  
  if (foundWordsCount === words.length) {
    // Suppression de la grille
    document.getElementById("grid").style.display = "none";
    // Message final percutant
    msg.innerHTML = "Rembarde Métallique ! 🌝☝️";
  } else {
    if (wordFound === "REMBARDE") msg.textContent = "🐾 MIAOU ! 🐾";
    else msg.textContent = "BIEN JOUÉ !";
    setTimeout(() => { if(foundWordsCount < words.length) msg.textContent = ""; }, 2000);
  }
}
</script>

</body>
</html>
